name: Send push notifications

# Free on public repositories. Runs on a schedule and sends any notification
# that has come due since the last run.
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # lets you trigger a run by hand to test

concurrency:
  group: push-notifications
  # A new run supersedes one still in flight, so a stuck job can never block
  # the next send.
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # a hung job must never sit burning minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install web-push@3 firebase-admin@12 --no-audit --no-fund

      - name: Send due notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          DATABASE_URL: https://miroku-app-915e2-default-rtdb.firebaseio.com
        run: node scripts/send-notifications.js
