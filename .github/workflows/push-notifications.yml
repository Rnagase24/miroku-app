name: Send push notifications

# Free on public repositories.
#
# The cron below says every five minutes. GitHub does not honour that. Measured
# over thirty consecutive scheduled runs on this repository: the shortest gap
# was 115 minutes, the median 211, the longest 423. Scheduled workflows are
# best-effort and are dropped under load, and a five-minute cron on a small
# public repo is dropped nearly every time.
#
# Everything here was built assuming a five-minute heartbeat, so anything with a
# short window missed constantly — going live announces only within three hours
# of the switch being flipped, and the median gap between runs was longer than
# that.
#
# So a run no longer tries to be a single instant. It stays alive and checks
# every minute. A single job may last six hours at most, so one trigger starts
# four shifts back to back — a little under twenty-three hours of watching from
# one start.
#
# That margin is the point. A watcher lasting under six hours would still have
# been a gamble: the longest gap measured between scheduled runs was seven
# hours, so a watcher could expire before anything arrived to replace it. At
# twenty-three hours the schedule can stay silent for the best part of a day
# and coverage still holds.
on:
  schedule:
    # Kept frequent on purpose: this is now "start a watcher if one is not
    # already running", and being dropped is harmless. concurrency below means
    # a new run simply replaces the old.
    - cron: '*/5 * * * *'
  workflow_dispatch:          # start one by hand
  push:
    branches: [main]          # and on every deploy

concurrency:
  group: push-notifications
  # A newer run replaces the one in flight, so the watcher is always recent and
  # a stuck job can never block the next.
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    strategy:
      # One shift at a time, each picking up as the last ends. Four of them
      # cover close to a full day from a single trigger.
      max-parallel: 1
      fail-fast: false
      matrix:
        shift: [1, 2, 3, 4]
    # Just under GitHub's six-hour ceiling for a job.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install web-push@3 firebase-admin@12 --no-audit --no-fund

      - name: Watch for and send due notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          DATABASE_URL: https://miroku-app-915e2-default-rtdb.firebaseio.com
          WATCH_MINUTES: '345'
        run: |
          set -u
          deadline=$(( $(date +%s) + WATCH_MINUTES * 60 ))
          cycle=0

          # The first pass prints everything, so each run opens with the full
          # picture: who is subscribed, what is switched on, whether anyone can
          # actually be reached. After that it stays quiet unless a cycle sends
          # something or finds something wrong.
          echo "── shift ${{ matrix.shift }} of 4 · first check, in full ──"
          node scripts/send-notifications.js || echo "!! first check failed — carrying on"

          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 60
            cycle=$(( cycle + 1 ))
            # A failed cycle must never end the watch: the next one is a minute
            # away and starts from a clean process.
            QUIET=1 node scripts/send-notifications.js || echo "!! cycle $cycle failed — carrying on"
            # A heartbeat every half hour, so a silent log still shows it is alive.
            if [ $(( cycle % 30 )) -eq 0 ]; then
              echo "── still watching · cycle $cycle · $(date -u '+%H:%M UTC') ──"
            fi
          done

          echo "── shift ${{ matrix.shift }} finished after $cycle checks ──"
